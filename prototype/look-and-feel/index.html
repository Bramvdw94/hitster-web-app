<title>Jaartal look-and-feel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Figtree:wght@400;600;800&family=Bebas+Neue&family=Manrope:wght@400;600;800&family=Dela+Gothic+One&family=Outfit:wght@400;600;800&display=swap">
<!--
  PROTOTYPE, throw away. Answers "Prototype the game-like look and feel" (issue #6).
  Three structurally different directions on one page, switchable with the
  floating bar, the arrow keys, or #A / #B / #C (also ?variant=A when run locally).
  All data is fake and lives in memory. No audio: the play button only simulates.
-->
<style>
html,body{height:100%}
body{margin:0;background:#000;min-height:100%;background-attachment:fixed;-webkit-tap-highlight-color:transparent}
#app{min-height:100%}
.screen{box-sizing:border-box;max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 112px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.4}
input{font:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
label{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Prototype switcher (not part of any design) ───────────────── */
.proto-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:100;display:flex;align-items:center;gap:6px;background:#fff;color:#111;border-radius:999px;padding:5px;box-shadow:0 8px 28px rgba(0,0,0,.5),0 0 0 2px #111;font:600 13px/1.1 system-ui,sans-serif;max-width:calc(100% - 20px);box-sizing:border-box}
.proto-bar>button{border:0;width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;background:#111;color:#fff;font-size:15px}
.proto-bar .lbl{white-space:nowrap;padding:0 4px;overflow:hidden;text-overflow:ellipsis}
.proto-bar .lbl small{display:block;font-weight:500;font-size:10px;letter-spacing:.08em;color:#777}
.proto-bar select{font:inherit;font-size:12px;border:1px solid #bbb;border-radius:999px;padding:7px 6px;background:#fff;color:#111;max-width:116px}

/* Shared bits every variant restyles */
.eq{display:flex;gap:3px;align-items:flex-end;height:18px}
.eq i{display:block;width:4px;height:4px;background:currentColor;border-radius:2px}
.on .eq i{animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s!important}.eq i:nth-child(3){animation-delay:-.6s!important}.eq i:nth-child(4){animation-delay:-.15s!important}
@keyframes eq{from{height:3px}to{height:18px}}
.cover{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-weight:800;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35)}

/* ══ A · Neonkaart ═══════════════════════════════════════════════
   One glowing card in the middle of a black stage; timeline scrolls sideways. */
body.vA{--bg:#07060c;--ink:#f5f2ff;--mute:#9a94b8;--line:#2a2540;--pink:#ff2e93;--cyan:#1fe1ff;--yellow:#ffe14d;--violet:#8b5cff;--good:#3dffa2;--bad:#ff4d6d;
  --display:"Unbounded",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif;color-scheme:dark;background:radial-gradient(120% 60% at 50% 0%,#1a0f2e 0%,var(--bg) 60%);color:var(--ink);font:400 15px/1.45 var(--body)}
.vA h1,.vA h2,.vA h3{margin:0}
.a-login{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;position:relative;padding-top:24px}
.a-rings{width:min(78vw,300px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,transparent 0 22%,var(--pink) 22.5% 24%,transparent 24.5% 36%,var(--cyan) 36.5% 38%,transparent 38.5% 50%,var(--yellow) 50.5% 52%,transparent 52.5% 64%,var(--violet) 64.5% 66%,transparent 66.5%);filter:drop-shadow(0 0 14px rgba(255,46,147,.5));animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04);filter:drop-shadow(0 0 26px rgba(31,225,255,.6))}}
.a-word{font:800 clamp(40px,13vw,60px)/.9 var(--display);letter-spacing:-.02em;margin-top:-6px}
.a-word span{display:block;background:linear-gradient(90deg,var(--pink),var(--yellow) 50%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.a-sub{font:500 12px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--mute)}
.a-tag{max-width:30ch;color:var(--mute);margin:0}
.btn-spotify{border:0;border-radius:999px;background:#1ed760;color:#0b1a10;font-weight:800;padding:16px 26px;font-size:16px;width:100%;max-width:320px}
.a-fine{font-size:12px;color:var(--mute);margin:0}
.a-head{display:flex;justify-content:space-between;align-items:flex-end}
.a-head small{color:var(--mute)}
.a-head h2{font:800 24px/1.1 var(--display)}
.a-ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--mute)}
.a-modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.a-mode{text-align:left;border-radius:20px;padding:16px 14px;min-height:140px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;background:#110d1d;border:2px solid var(--line)}
.a-mode b{font:800 20px/1 var(--display)}
.a-mode span{font-size:13px;color:var(--mute)}
.a-mode.sel.pink{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink),0 0 28px rgba(255,46,147,.45);background:linear-gradient(160deg,#3a0f2a,#110d1d 70%)}
.a-mode.sel.cyan{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 28px rgba(31,225,255,.4);background:linear-gradient(160deg,#0d2e38,#110d1d 70%)}
.a-label{font:500 11px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.a-chips{display:flex;flex-wrap:wrap;gap:8px}
.a-chip{border:1px solid var(--line);background:#110d1d;border-radius:999px;padding:8px 14px;font-size:14px}
.a-chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.a-seg{display:flex;background:#110d1d;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.a-seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px 6px;font-weight:600;color:var(--mute)}
.a-seg button.sel{background:var(--violet);color:#fff}
.a-hint{font-size:13px;color:var(--mute);margin:0}
.a-cta{margin-top:auto;border:0;border-radius:18px;padding:18px;font:800 17px/1 var(--display);color:#14041a;background:linear-gradient(90deg,var(--pink),var(--yellow));box-shadow:0 8px 30px rgba(255,46,147,.35)}
.a-bar{display:flex;justify-content:space-between;align-items:center;font:500 12px/1 var(--display);letter-spacing:.06em;color:var(--mute)}
.a-bar b{color:var(--ink)}
.tok{display:inline-flex;gap:4px}
.tok i{width:12px;height:12px;border-radius:50%;border:2px solid var(--yellow,#fc0);display:block;box-sizing:border-box}
.tok i.f{background:var(--yellow,#fc0)}
.a-card{align-self:center;width:min(62vw,230px);aspect-ratio:1;border-radius:26px;padding:3px;background:conic-gradient(from 0deg,var(--pink),var(--yellow),var(--cyan),var(--violet),var(--pink));box-shadow:0 0 40px rgba(139,92,255,.45)}
.a-card.on{animation:glow 2s linear infinite}
@keyframes glow{50%{box-shadow:0 0 60px rgba(255,46,147,.7)}}
.a-card-in{height:100%;border-radius:23px;background:#0d0a17;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--cyan)}
.a-q{font:800 96px/1 var(--display);color:var(--ink)}
.a-card.small{width:min(44vw,160px)}
.a-card.small .a-q{font-size:64px}
.a-player{display:flex;align-items:center;gap:12px}
.a-play{width:52px;height:52px;flex:none;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:18px}
.a-restart{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink)}
.a-prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.a-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink))}
.a-time{font:500 12px/1 var(--display);color:var(--mute);width:38px;text-align:right;font-variant-numeric:tabular-nums}
.a-tl{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x proximity}
.a-tc{flex:none;width:96px;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;background:#130f22;border:1px solid var(--line);scroll-snap-align:center}
.a-tc b{font:800 22px/1 var(--display)}
.a-tc span{font-size:12px;color:var(--mute);line-height:1.25}
.a-tc.new{border-color:var(--good);box-shadow:0 0 20px rgba(61,255,162,.35)}
.a-tc.new.badc{border-color:var(--bad);box-shadow:0 0 20px rgba(255,77,109,.35);opacity:.7}
.a-slot{flex:none;width:34px;border-radius:12px;border:2px dashed var(--line);background:none;color:var(--mute);font:800 18px/1 var(--display)}
.a-slot.sel{border:2px solid var(--pink);background:rgba(255,46,147,.18);color:var(--ink);box-shadow:0 0 18px rgba(255,46,147,.5);width:48px}
.a-guess{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.a-field label{font-size:12px;color:var(--mute);margin-bottom:4px}
.a-field input{width:100%;box-sizing:border-box;background:#110d1d;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink)}
.a-field input:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(31,225,255,.2)}
.a-year{text-align:center}
.a-year output{font:800 72px/1 var(--display);letter-spacing:-.03em;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.a-range{width:100%;accent-color:var(--pink)}
.a-ticks{display:flex;justify-content:space-between;font:500 11px/1 var(--display);color:var(--mute);margin-top:-8px}
.a-verdict{font:800 26px/1.1 var(--display);text-align:center}
.a-verdict.ok{color:var(--good)}.a-verdict.bad{color:var(--bad)}
.a-back{align-self:center;width:min(70vw,250px);border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;color:#14041a;background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 0 40px color-mix(in srgb,var(--c1) 60%,transparent)}
.a-back .cover{width:96px;border-radius:12px;border:2px solid rgba(255,255,255,.6)}
.a-back .ar{font-weight:800;font-size:16px}
.a-back .yr{font:800 64px/1 var(--display);letter-spacing:-.03em}
.a-back .ti{font-style:italic;font-weight:600}
.a-rows{display:flex;flex-direction:column;gap:8px}
.a-row{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#110d1d;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.a-row span{color:var(--mute);font-size:13px}
.pill{border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px;white-space:nowrap}
.vA .pill.ok{background:var(--good);color:#04210f}.vA .pill.mid{background:var(--yellow);color:#2a2000}.vA .pill.bad{background:var(--bad);color:#fff}
.a-judge{display:flex;gap:8px}.a-judge button{flex:1;border-radius:12px;padding:12px;border:1px solid var(--line);background:#110d1d;font-weight:800}
.a-judge button.sel{background:var(--ink);color:var(--bg)}

/* ══ B · Platenspeler ═════════════════════════════════════════════
   A turning record on top, the timeline as a vertical ladder you insert into. */
body.vB{--bg:#140d33;--panel:#1f1748;--ink:#fff4ea;--mute:#a99fd1;--line:#3a2f72;--hot:#ff7a3d;--lilac:#c7a6ff;--good:#7dffb0;--bad:#ff6b8a;--vinyl:#0b0816;
  --display:"Bebas Neue",Impact,sans-serif;--body:"Manrope",system-ui,sans-serif;color-scheme:dark;background:linear-gradient(180deg,#24135a 0%,var(--bg) 45%);color:var(--ink);font:400 15px/1.45 var(--body)}
.vB h1,.vB h2,.vB h3{margin:0;font-weight:400}
.b-vinyl{position:relative;width:min(72vw,280px);aspect-ratio:1;align-self:center;border-radius:50%;background:repeating-radial-gradient(circle,var(--vinyl) 0 2px,#1b1630 2.5px 3.5px);box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 0 0 1px #2c2550}
.b-vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(130deg,transparent 38%,rgba(255,255,255,.12) 50%,transparent 62%)}
.b-label{position:absolute;inset:32%;border-radius:50%;background:radial-gradient(circle,var(--vinyl) 0 6%,var(--hot) 6.5% 100%);display:grid;place-items:center;color:#2a0d00;text-align:center}
.b-label span{font:400 clamp(26px,8vw,40px)/1 var(--display)}
.b-spin{animation:spin 2.4s linear infinite;animation-play-state:paused}
.on .b-spin{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.b-arm{position:absolute;top:-6%;right:-4%;width:14%;height:62%;transform-origin:50% 8%;transform:rotate(18deg);transition:transform .5s}
.on .b-arm{transform:rotate(30deg)}
.b-arm::before{content:"";position:absolute;left:44%;top:0;width:12%;height:100%;background:linear-gradient(#ddd,#888);border-radius:6px}
.b-arm::after{content:"";position:absolute;left:20%;bottom:-4%;width:60%;height:14%;background:#cfcfcf;border-radius:4px}
.b-title{font:400 clamp(52px,17vw,84px)/.85 var(--display);letter-spacing:.01em}
.b-title em{font-style:normal;color:var(--hot)}
.b-login{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px}
.b-login p{color:var(--mute);margin:0;max-width:32ch}
.b-login .btn-spotify{max-width:none;border-radius:14px}
.b-login small{color:var(--mute)}
.b-top{display:flex;justify-content:space-between;align-items:center}
.b-top h2{font:400 34px/1 var(--display);letter-spacing:.02em}
.b-link{background:none;border:0;color:var(--lilac);text-decoration:underline;padding:4px}
.b-list{display:flex;flex-direction:column;background:var(--panel);border-radius:18px;overflow:hidden}
.b-opt{display:flex;align-items:center;gap:14px;padding:16px;border:0;background:none;text-align:left;border-bottom:1px solid var(--line)}
.b-opt:last-child{border-bottom:0}
.b-opt .rd{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--mute);box-sizing:border-box}
.b-opt.sel .rd{border:7px solid var(--hot)}
.b-opt .box{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--mute);box-sizing:border-box;display:grid;place-items:center;font-size:14px;color:#2a0d00}
.b-opt.sel .box{background:var(--hot);border-color:var(--hot)}
.b-opt b{display:block;font-weight:800}
.b-opt span{display:block;font-size:13px;color:var(--mute)}
.b-opt .n{margin-left:auto;font:400 20px/1 var(--display);color:var(--mute)}
.b-sec{font:400 18px/1 var(--display);letter-spacing:.12em;color:var(--lilac);margin-top:4px}
.b-tabs{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.b-tabs button{background:none;border:0;padding:8px 0;color:var(--mute);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.b-tabs button.sel{color:var(--ink);border-color:var(--hot)}
.b-cta{margin-top:auto;border:0;border-radius:14px;padding:16px;background:var(--hot);color:#2a0d00;font:400 26px/1 var(--display);letter-spacing:.06em;box-shadow:0 10px 30px rgba(255,122,61,.35);z-index:2}
.b-status{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px}
.b-status b{color:var(--ink)}
.b-ctrl{display:flex;justify-content:center;align-items:center;gap:18px}
.b-ctrl button{border:0;border-radius:50%;display:grid;place-items:center}
.b-play{width:64px;height:64px;background:var(--ink);color:var(--bg);font-size:22px}
.b-re{width:44px;height:44px;background:var(--panel);color:var(--ink)}
.b-time{font:400 22px/1 var(--display);color:var(--mute);font-variant-numeric:tabular-nums;width:54px;text-align:center}
.b-ladder{list-style:none;margin:0;padding:0 0 0 34px;position:relative;display:flex;flex-direction:column;gap:4px}
.b-ladder::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:var(--line)}
.b-row{position:relative;display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:12px;padding:10px 14px}
.b-row::before{content:"";position:absolute;left:-27px;width:10px;height:10px;border-radius:50%;background:var(--lilac)}
.b-row .yr{font:400 34px/1 var(--display);color:var(--lilac);width:62px;flex:none}
.b-row b{display:block;font-weight:800;line-height:1.2}
.b-row span{font-size:13px;color:var(--mute)}
.b-row.new{outline:2px solid var(--good)}
.b-row.new .yr{color:var(--good)}
.b-row.new.badc{outline-color:var(--bad);opacity:.75}.b-row.new.badc .yr{color:var(--bad)}
.b-gap{width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:6px;color:var(--mute);font-size:12px;text-align:left}
.b-gap.sel{border:2px solid var(--hot);background:rgba(255,122,61,.14);color:var(--ink);padding:14px;font-weight:800}
.b-field label{font-size:12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.b-field input{width:100%;box-sizing:border-box;background:none;border:0;border-bottom:2px solid var(--line);padding:10px 0;color:var(--ink);font-size:18px}
.b-field input:focus{outline:none;border-color:var(--hot)}
.b-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.b-yearbox{display:flex;align-items:baseline;justify-content:center;gap:8px}
.b-yearbox output{font:400 96px/.9 var(--display);color:var(--hot);font-variant-numeric:tabular-nums}
.b-yearbox span{color:var(--mute)}
.b-ruler{position:relative;height:56px}
.b-ruler::before{content:"";position:absolute;inset:0 0 18px;background:repeating-linear-gradient(90deg,var(--mute) 0 1px,transparent 1px calc(100%/75)),repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px calc(100%/7.5));background-size:100% 40%,100% 100%;background-repeat:no-repeat;background-position:bottom,bottom;opacity:.6;pointer-events:none}
.b-ruler input{position:absolute;inset:0;width:100%;margin:0;opacity:0;cursor:pointer}
.b-needle{position:absolute;top:-6px;bottom:14px;width:3px;margin-left:-1.5px;background:var(--hot);border-radius:2px;box-shadow:0 0 12px var(--hot);pointer-events:none}
.b-ruler-l{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;font:400 14px/1 var(--display);color:var(--mute);pointer-events:none}
.b-sleeve{display:flex;gap:14px;align-items:center;background:var(--panel);border-radius:18px;padding:14px}
.b-sleeve .cover{width:88px;flex:none;border-radius:6px}
.b-sleeve .yr{font:400 54px/.9 var(--display);color:var(--hot)}
.b-sleeve b{display:block;font-size:17px}
.b-sleeve span{color:var(--mute)}
.b-score{display:flex;flex-direction:column}
.b-score div{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}
.b-score div span{color:var(--mute)}
.b-score strong{font:400 26px/1 var(--display);letter-spacing:.03em}
.vB .ok{color:var(--good)}.vB .mid{color:#ffd166}.vB .bad{color:var(--bad)}
.b-big{font:400 54px/.9 var(--display);text-align:center}
.b-judge{display:flex;gap:10px}.b-judge button{flex:1;border:2px solid var(--line);background:none;border-radius:12px;padding:12px;font-weight:800}
.b-judge button.sel{border-color:var(--hot);background:var(--hot);color:#2a0d00}

/* ══ C · Speltafel ════════════════════════════════════════════════
   Physical cards on a felt table: QR side up while listening, flip to read the back. */
body.vC{--felt:#0e6e62;--felt2:#0a5a50;--paper:#fffdf6;--ink:#141414;--onfelt:#f3fff9;--mute:#bfe6dc;--coin:#ffc93c;--good:#2ee59d;--bad:#ff5a5f;--c-pink:#ff4fa3;--c-blue:#3fb6ff;--c-yel:#ffe14d;--c-pur:#a77bff;
  --display:"Dela Gothic One",Impact,sans-serif;--body:"Outfit",system-ui,sans-serif;color-scheme:light;background:radial-gradient(circle at 50% 30%,var(--felt) 0%,var(--felt2) 100%);color:var(--onfelt);font:400 16px/1.45 var(--body)}
.vC h1,.vC h2,.vC h3{margin:0;font-weight:400}
.c-box{border:3px solid var(--ink);border-radius:16px;background:var(--paper);color:var(--ink);box-shadow:5px 5px 0 var(--ink)}

.c-judge button{flex:1;border:3px solid var(--ink);border-radius:12px;padding:12px;background:var(--paper);color:var(--ink);font-weight:800;box-shadow:3px 3px 0 var(--ink)}
.c-judge button.sel{background:var(--coin)}

</style>

<div id="app"></div>

<script>
/* ---------- fake data (prototype only) ---------- */
const START_TIMELINE = [
  {title:'Venus', artist:'Shocking Blue', year:1969, c:0},
  {title:'Radar Love', artist:'Golden Earring', year:1973, c:1},
  {title:'Dromen zijn bedrog', artist:'Marco Borsato', year:1994, c:2},
  {title:'Zoutelande', artist:'BLØF & Geike Arnaert', year:2017, c:3},
];
const MYSTERY = {title:'De Bom', artist:'Doe Maar', year:1982, c:4};
const PRACTICE_SONG = {title:"Nobody's Wife", artist:'Anouk', year:1997, c:5};
const COVERS = [['#ff4fa3','#ffb703'],['#3fb6ff','#7b2ff7'],['#ff7a3d','#ffd166'],['#2ee59d','#118ab2'],['#ffe14d','#ff4fa3'],['#a77bff','#3fb6ff']];
// Edition names are placeholders until the song import is designed.
const EDITIONS = [['all','Alle Nederlandse edities',1240],['orig','Original',300],['gp','Guilty Pleasures',300],['summer','Summer Party',300],['nl','Nederlandstalig',340]];
const PLAYERS = ['Bram','Sanne','Joost','Lieke'];
const SCREENS = [['login','Inloggen'],['home','Modus + editie'],['game','Spel: luisteren + plaatsen'],['gameReveal','Spel: onthulling'],['practice','Oefenen: raden'],['practiceReveal','Oefenen: onthulling']];

const S = {screen:'login', mode:'game', editions:['all'], gv:'Original', who:'solo', playing:false, t:0, slot:null,
  year:1990, artist:'', title:'', judge:null, res:null, timeline:[...START_TIMELINE], song:7, tokens:2, streak:4};

/* ---------- typo-tolerant matching, as decided in issue #4 ---------- */
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ø/g,'o').replace(/\(.*?\)/g,' ')
  .replace(/&/g,' en ').replace(/\b(the|de|het)\b/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function osa(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=0;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}
  return d[a.length][b.length]}
function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;return 1-osa(a,b)/Math.max(a.length,b.length)}
function matches(guess,answer){const parts=[answer,...answer.split(/\s*(?:&|,|feat\.?|ft\.?)\s*/i)];return Math.max(...parts.map(p=>sim(guess,p)))>=0.8}

/* ---------- game logic ---------- */
function resetRound(){S.playing=false;S.t=0;S.slot=null;S.artist='';S.title='';S.judge=null;S.res=null;S.year=1990;S.timeline=[...START_TIMELINE]}
function place(){
  const lo=S.timeline.filter(c=>c.year<MYSTERY.year).length, hi=S.timeline.filter(c=>c.year<=MYSTERY.year).length;
  const ok=S.slot>=lo&&S.slot<=hi;
  const named=S.who==='solo'&&matches(S.artist,MYSTERY.artist)&&matches(S.title,MYSTERY.title);
  if(named)S.tokens=Math.min(5,S.tokens+1);
  const tl=[...S.timeline];tl.splice(S.slot,0,{...MYSTERY,isNew:true,bad:!ok});
  S.res={ok,named,tl,cards:S.timeline.length+(ok?1:0)};S.playing=false;S.screen='gameReveal';
}
function check(){
  const diff=Math.abs(S.year-PRACTICE_SONG.year), artistOk=matches(S.artist,PRACTICE_SONG.artist);
  const yearCls=diff===0?'ok':diff<=3?'mid':'bad';
  const yearTxt=diff===0?'Precies goed':diff+' jaar ernaast';
  if(diff<=3&&artistOk)S.streak++;else S.streak=0;
  S.res={diff,artistOk,yearCls,yearTxt,weak:diff>3||!artistOk};S.playing=false;S.screen='practiceReveal';
}
const fmt=t=>'0:'+String(Math.floor(t)).padStart(2,'0');
const isEd=id=>S.editions.includes(id);
const edLabel=()=>isEd('all')?'Alle edities':S.editions.length+' edities';
const tokens=()=>`<span class="tok" aria-label="${S.tokens} tokens">${[0,1,2,3,4].map(i=>`<i class="${i<S.tokens?'f':''}"></i>`).join('')}</span>`;
const eq=()=>`<span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>`;
const cover=(s,cls='')=>`<div class="cover ${cls}" style="background:linear-gradient(135deg,${COVERS[s.c][0]},${COVERS[s.c][1]})" role="img" aria-label="Hoes van ${s.title}">${s.title.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>`;
const turnName=()=>S.who==='solo'?'Bram':PLAYERS[(S.song)%PLAYERS.length];
const cc=s=>`--c1:${COVERS[s.c][0]};--c2:${COVERS[s.c][1]}`;
const playLabel=()=>S.playing?'❚❚':'▶';
const judgeBtns=(cls)=>`<div class="${cls}" role="group" aria-label="Artiest en titel goed?"><button data-act="judge:yes" class="${S.judge==='yes'?'sel':''}">Artiest + titel goed</button><button data-act="judge:no" class="${S.judge==='no'?'sel':''}">Fout</button></div>`;

/* QR-like pattern for the card front in variant C (decorative) */
const QR=(()=>{let s=7,r='';const n=17,rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="5" height="5" fill="none" stroke="#141414" stroke-width="1"/><rect x="${x+1.5}" y="${y+1.5}" width="2" height="2" fill="#141414"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const inF=(x<6&&y<6)||(x>10&&y<6)||(x<6&&y>10);if(!inF&&rnd()>.52)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#141414"/>`}
  return `<svg viewBox="-0.5 -0.5 18 18" aria-hidden="true">${finder(0,0)}${finder(12,0)}${finder(0,12)}${r}</svg>`})();

/* ═════════ Variant A · Neonkaart ═════════ */
const aPlayer=()=>`<div class="a-player"><button class="a-play" data-act="play" aria-label="${S.playing?'Pauze':'Afspelen'}">${playLabel()}</button>
  <div class="a-prog"><i data-prog style="width:${S.t/30*100}%"></i></div><span class="a-time" data-time>${fmt(S.t)}</span>
  <button class="a-restart" data-act="restart" aria-label="Opnieuw vanaf begin">↺</button></div>`;
const aTimeline=(tl,slots)=>{let h='';tl.forEach((c,i)=>{
    if(slots)h+=`<button class="a-slot ${S.slot===i?'sel':''}" data-act="slot:${i}" aria-label="Plaats voor ${c.year}">+</button>`;
    h+=`<div class="a-tc ${c.isNew?'new':''} ${c.bad?'badc':''}"><b>${c.year}</b><span>${c.title}<br>${c.artist}</span></div>`});
  if(slots)h+=`<button class="a-slot ${S.slot===tl.length?'sel':''}" data-act="slot:${tl.length}" aria-label="Plaats na ${tl[tl.length-1].year}">+</button>`;
  return `<div class="a-tl">${h}</div>`};
const aBack=s=>`<div class="a-back" style="${cc(s)}">${cover(s)}<div class="ar">${s.artist}</div><div class="yr">${s.year}</div><div class="ti">${s.title}</div></div>`;
const A={name:'Neonkaart',cls:'vA',
login:()=>`<div class="a-login"><div class="a-rings" aria-hidden="true"></div>
  <h1 class="a-word"><span>JAARTAL</span></h1><div class="a-sub">oefenen voor Hitster</div>
  <p class="a-tag">Raad het jaar, bouw je tijdlijn, en win op oudejaarsavond.</p>
  <button class="btn-spotify" data-act="login">Inloggen met Spotify</button>
  <p class="a-fine">Alleen voor uitgenodigde spelers · Spotify Premium nodig</p></div>`,
home:()=>`<header class="a-head"><div><small>Hoi Bram</small><h2>Wat ga je doen?</h2></div><button class="a-ghost" data-act="go:login">Uitloggen</button></header>
  <div class="a-modes">
   <button class="a-mode pink ${S.mode==='game'?'sel':''}" data-act="mode:game"><b>Spel</b><span>Tijdlijn bouwen tot 10 kaarten</span></button>
   <button class="a-mode cyan ${S.mode==='practice'?'sel':''}" data-act="mode:practice"><b>Oefenen</b><span>Jaar en artiest raden</span></button></div>
  <h3 class="a-label">Edities</h3>
  <div class="a-chips">${EDITIONS.map(([id,n])=>`<button class="a-chip ${isEd(id)?'sel':''}" data-act="ed:${id}">${n}</button>`).join('')}</div>
  ${S.mode==='game'?`<h3 class="a-label">Variant</h3><div class="a-seg">${['Original','Pro','Expert'].map(v=>`<button class="${S.gv===v?'sel':''}" data-act="gv:${v}">${v}</button>`).join('')}</div>
  <h3 class="a-label">Spelers</h3><div class="a-seg"><button class="${S.who==='solo'?'sel':''}" data-act="who:solo">Solo</button><button class="${S.who==='group'?'sel':''}" data-act="who:group">Samen, 1 telefoon</button></div>`
  :`<p class="a-hint">Nummers die je vaak fout hebt komen vaker terug.</p>`}
  <button class="a-cta" data-act="start">${S.mode==='game'?'Start spel':'Start oefenen'}</button>`,
game:()=>`<header class="a-bar"><span><b>${turnName()}</b> · nummer ${S.song}</span>${tokens()}<span><b>${S.timeline.length}</b>/10</span></header>
  <div class="a-card ${S.playing?'on':''}"><div class="a-card-in"><span class="a-q">?</span>${eq()}</div></div>
  ${aPlayer()}
  <h3 class="a-label">Waar hoort dit nummer?</h3>${aTimeline(S.timeline,true)}
  ${S.who==='solo'?`<div class="a-guess"><div class="a-field"><label for="a-ar">Artiest</label><input id="a-ar" data-in="artist" value="${S.artist}" autocomplete="off" placeholder="Bijv. Doe Maar"></div>
  <div class="a-field"><label for="a-ti">Titel</label><input id="a-ti" data-in="title" value="${S.title}" autocomplete="off"></div></div><p class="a-hint">Allebei goed levert een token op.</p>`:''}
  <button class="a-cta" data-act="place" ${S.slot==null?'disabled':''}>Plaats kaart</button>`,
gameReveal:()=>{const r=S.res;return `<div class="a-verdict ${r.ok?'ok':'bad'}">${r.ok?'Goed geplaatst!':'Helaas, verkeerde plek'}</div>
  ${aBack(MYSTERY)}
  ${S.who==='solo'?`<div class="a-row"><span>Artiest + titel</span><span class="pill ${r.named?'ok':'bad'}">${r.named?'+1 token':'Geen token'}</span></div>`:judgeBtns('a-judge')}
  ${aTimeline(r.tl,false)}
  <button class="a-cta" data-act="next">${r.cards>=10?'Bekijk score':'Volgend nummer'}</button>`},
practice:()=>`<header class="a-bar"><span><b>Oefenen</b> · ${edLabel()}</span><span>Reeks <b>${S.streak}</b></span></header>
  <div class="a-card small ${S.playing?'on':''}"><div class="a-card-in"><span class="a-q">?</span>${eq()}</div></div>
  ${aPlayer()}
  <div class="a-year"><output data-year for="a-yr">${S.year}</output></div>
  <input type="range" class="a-range" id="a-yr" min="1950" max="2025" value="${S.year}" data-in="year" aria-label="Jaar">
  <div class="a-ticks"><span>1950</span><span>1975</span><span>2000</span><span>2025</span></div>
  <div class="a-field"><label for="a-pa">Artiest</label><input id="a-pa" data-in="artist" value="${S.artist}" autocomplete="off" placeholder="Typ de artiest, typfouten mogen"></div>
  <button class="a-cta" data-act="check">Check</button>`,
practiceReveal:()=>{const r=S.res;return `${aBack(PRACTICE_SONG)}
  <div class="a-rows"><div class="a-row"><span>Jaar · jij zei ${S.year}</span><span class="pill ${r.yearCls}">${r.yearTxt}</span></div>
  <div class="a-row"><span>Artiest · "${S.artist||'leeg'}"</span><span class="pill ${r.artistOk?'ok':'bad'}">${r.artistOk?'Goed':'Fout'}</span></div></div>
  <p class="a-hint">${r.weak?'Dit nummer komt vaker terug.':'Reeks: '+S.streak+' op rij.'}</p>
  <button class="a-cta" data-act="next">Volgend nummer</button>`},
};

/* ═════════ Variant B · Platenspeler ═════════ */
const bVinyl=(labelTxt)=>`<div class="b-vinyl ${S.playing?'on':''}"><div class="b-spin" style="position:absolute;inset:0"><div class="b-label"><span>${labelTxt}</span></div></div><div class="b-arm" aria-hidden="true"></div></div>`;
const bCtrl=()=>`<div class="b-ctrl ${S.playing?'on':''}"><button class="b-re" data-act="restart" aria-label="Opnieuw vanaf begin">↺</button>
  <button class="b-play" data-act="play" aria-label="${S.playing?'Pauze':'Afspelen'}">${playLabel()}</button><span class="b-time" data-time>${fmt(S.t)}</span></div>`;
const bLadder=(tl,slots)=>{let h='';tl.forEach((c,i)=>{
    if(slots)h+=`<li><button class="b-gap ${S.slot===i?'sel':''}" data-act="slot:${i}">${S.slot===i?'Hier plaatsen':i===0?'Vóór '+c.year:'Tussen '+tl[i-1].year+' en '+c.year}</button></li>`;
    h+=`<li class="b-row ${c.isNew?'new':''} ${c.bad?'badc':''}"><span class="yr">${c.year}</span><span><b>${c.title}</b><span>${c.artist}</span></span></li>`});
  if(slots){const i=tl.length;h+=`<li><button class="b-gap ${S.slot===i?'sel':''}" data-act="slot:${i}">${S.slot===i?'Hier plaatsen':'Na '+tl[i-1].year}</button></li>`}
  return `<ol class="b-ladder">${h}</ol>`};

const B={name:'Platenspeler',cls:'vB',

/* ═════════ Variant C · Speltafel ═════════ */
const cBg=s=>['var(--c-pink)','var(--c-blue)','var(--c-yel)','var(--c-pur)','var(--c-pink)','var(--c-blue)'][s.c];
const cMini=(s,cls='',style='')=>`<div class="c-mini ${cls}" style="background:${cBg(s)};${style}"><b>${s.artist}</b><strong>${s.year}</strong><i>${s.title}</i></div>`;
const cCard=(s,flipped)=>`<div class="c-stage"><div class="c-card ${flipped?'flip':''} ${S.playing?'on':''}">
  <div class="c-face c-front">${QR}<small>${S.playing?'SPEELT…':'TIK OP AFSPELEN'}</small>${eq()}</div>
  <div class="c-face c-back" style="--cc:${cBg(s)}"><div class="ar">${s.artist}</div><div class="c-mid">${cover(s)}<div class="yr">${s.year}</div></div><div class="ti">${s.title}</div></div></div></div>`;
const cCtrl=()=>`<div class="c-ctrl"><button data-act="restart" aria-label="Opnieuw vanaf begin">↺</button><button class="pp" data-act="play">${S.playing?'❚❚ Pauze':'▶ Afspelen'}</button><span data-time style="font-weight:800">${fmt(S.t)}</span></div>
  <div class="c-prog"><i data-prog style="width:${S.t/30*100}%"></i></div>`;
const cTable=(tl,slots)=>{let h='';tl.forEach((c,i)=>{
    if(slots)h+=`<button class="c-gap ${S.slot===i?'sel':''}" data-act="slot:${i}" aria-label="Plaats voor ${c.year}">${S.slot===i?'HIER':'+'}</button>`;
    h+=cMini(c,'c-tc '+(c.isNew?'new ':'')+(c.bad?'badc':''))});
  if(slots)h+=`<button class="c-gap ${S.slot===tl.length?'sel':''}" data-act="slot:${tl.length}" aria-label="Plaats na ${tl[tl.length-1].year}">${S.slot===tl.length?'HIER':'+'}</button>`;
  return `<div class="c-table">${h}</div>`};
const cPlayers=()=>`<div class="c-players">${(S.who==='solo'?['Bram']:PLAYERS).map(p=>`<span class="c-pl c-box ${p===turnName()?'me':''}">${p} ${p===turnName()?tokens():''}</span>`).join('')}<span class="c-count">${S.timeline.length}/10</span></div>`;
const C={name:'Speltafel',cls:'vC',
login:()=>`<div class="c-login"><div class="c-fan" aria-hidden="true">
  ${cMini(START_TIMELINE[0],'','transform:rotate(-16deg)')}${cMini(MYSTERY,'','transform:rotate(0deg) translateY(-8px)')}${cMini(START_TIMELINE[3],'','transform:rotate(16deg)')}</div>
  <h1 class="c-word">JAARTAL</h1><p>Oefenen voor Hitster. Alle Nederlandse edities, op je telefoon.</p>
  <button class="c-btn spot" data-act="login">Inloggen met Spotify</button><p style="font-size:13px">Alleen voor uitgenodigde spelers · Spotify Premium nodig</p></div>`,
home:()=>`<div class="c-head"><h2>Hoi Bram!</h2><button class="c-x" data-act="go:login">Uitloggen</button></div>
  <div class="c-modes"><button class="c-box c-mode ${S.mode==='game'?'sel':''}" data-act="mode:game"><span class="ic" style="background:var(--c-pink)">10</span><span><b>Spel</b><span>Bouw een tijdlijn van 10 kaarten</span></span></button>
  <button class="c-box c-mode ${S.mode==='practice'?'sel':''}" data-act="mode:practice"><span class="ic" style="background:var(--c-blue)">'97</span><span><b>Oefenen</b><span>Raad jaar en artiest per nummer</span></span></button></div>
  ${S.mode==='game'?`<h3 class="c-sec">VARIANT</h3><div class="c-seg">${['Original','Pro','Expert'].map(v=>`<button class="${S.gv===v?'sel':''}" data-act="gv:${v}">${v}</button>`).join('')}</div>
  <h3 class="c-sec">SPELERS</h3><div class="c-seg"><button class="${S.who==='solo'?'sel':''}" data-act="who:solo">Solo</button><button class="${S.who==='group'?'sel':''}" data-act="who:group">Samen (1 telefoon)</button></div>`:''}
  <h3 class="c-sec">EDITIES</h3><div class="c-eds">${EDITIONS.map(([id,n,k])=>`<button class="c-box c-ed ${isEd(id)?'sel':''}" data-act="ed:${id}">${n}<small>${k} kaarten</small></button>`).join('')}</div>
  <button class="c-btn main" data-act="start">${S.mode==='game'?'START SPEL':'START OEFENEN'}</button>`,
game:()=>`${cPlayers()}${cCard(MYSTERY,false)}${cCtrl()}
  <h3 class="c-sec" style="text-align:center">TIK WAAR DE KAART HOORT</h3>${cTable(S.timeline,true)}
  ${S.who==='solo'?`<div class="c-two"><div class="c-field"><label for="c-ar">ARTIEST</label><input id="c-ar" data-in="artist" value="${S.artist}" autocomplete="off"></div><div class="c-field"><label for="c-ti">TITEL</label><input id="c-ti" data-in="title" value="${S.title}" autocomplete="off"></div></div>`:''}
  <button class="c-btn main" data-act="place" ${S.slot==null?'disabled':''}>LEG KAART NEER</button>`,
gameReveal:()=>{const r=S.res;return `${cPlayers()}${cCard(MYSTERY,true)}
  <div class="c-stamp ${r.ok?'ok':'bad'}">${r.ok?'GOED!':'FOUT!'}</div>
  ${S.who==='solo'?`<p class="c-note">${r.named?'Artiest en titel goed: +1 token':'Artiest of titel niet goed: geen token'}</p>`:judgeBtns('c-judge')}
  ${cTable(r.tl,false)}
  <button class="c-btn main" data-act="next">VOLGENDE KAART</button>`},
practice:()=>`<div class="c-players"><span class="c-pl c-box me">Oefenen · ${edLabel()}</span><span class="c-count">Reeks ${S.streak}</span></div>
  ${cCard(PRACTICE_SONG,false)}${cCtrl()}
  <div class="c-yearrow"><button data-act="yr:-1" aria-label="Een jaar eerder">−</button><output data-year>${S.year}</output><button data-act="yr:1" aria-label="Een jaar later">+</button></div>
  <input type="range" class="c-range" id="c-yr" min="1950" max="2025" value="${S.year}" data-in="year" aria-label="Jaar">
  <div class="c-field"><label for="c-pa">ARTIEST</label><input id="c-pa" data-in="artist" value="${S.artist}" autocomplete="off" placeholder="Typfouten mogen"></div>
  <button class="c-btn main" data-act="check">DRAAI KAART OM</button>`,
practiceReveal:()=>{const r=S.res;return `${cCard(PRACTICE_SONG,true)}
  <div class="c-stamp ${r.yearCls}">${r.yearTxt.toUpperCase()}</div>
  <div class="c-res"><div class="c-box"><span>Jaar · jij zei ${S.year}</span><span class="pill ${r.yearCls}">${r.yearTxt}</span></div>
  <div class="c-box"><span>Artiest · "${S.artist||'leeg'}"</span><span class="pill ${r.artistOk?'ok':'bad'}">${r.artistOk?'Goed':'Fout'}</span></div></div>
  <p class="c-note">${r.weak?'Dit nummer komt vaker terug.':S.streak+' op rij!'}</p>
  <button class="c-btn main" data-act="next">VOLGENDE KAART</button>`},
};

/* ---------- switcher + rendering ---------- */
const VARIANTS={A,B,C}, KEYS=Object.keys(VARIANTS);
function readVariant(){const h=location.hash.replace('#','').toUpperCase();if(KEYS.includes(h))return h;
  try{const q=new URLSearchParams(location.search).get('variant');if(q&&KEYS.includes(q.toUpperCase()))return q.toUpperCase()}catch(e){}return 'A'}
let variant=readVariant();
function setVariant(k){variant=k;try{history.replaceState(null,'','#'+k)}catch(e){location.hash=k}render()}
function cycle(d){setVariant(KEYS[(KEYS.indexOf(variant)+d+KEYS.length)%KEYS.length])}
function ensureResult(){ // jumping straight to a reveal screen needs a sample answer
  if(S.screen==='gameReveal'&&!S.res){S.slot=S.slot??2;S.artist=S.artist||'Doe Mar';S.title=S.title||'De bom';place()}
  if(S.screen==='practiceReveal'&&!S.res){S.year=1994;S.artist=S.artist||'Annouk';check()}}
function render(){
  ensureResult();
  const V=VARIANTS[variant];
  document.body.className=V.cls;
  document.getElementById('app').innerHTML=`<main class="screen">${V[S.screen]()}</main>
  <nav class="proto-bar" aria-label="Prototype: ontwerp wisselen"><button data-proto="-1" aria-label="Vorig ontwerp">←</button>
  <span class="lbl"><small>PROTOTYPE</small>${variant} · ${V.name}</span><button data-proto="1" aria-label="Volgend ontwerp">→</button>
  <select id="proto-screen" aria-label="Scherm">${SCREENS.map(([k,n])=>`<option value="${k}" ${S.screen===k?'selected':''}>${n}</option>`).join('')}</select></nav>`;
  if(S.screen.endsWith('Reveal'))requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelector('.c-card.flip')?.classList.add('go')));
}
function go(screen){S.screen=screen;window.scrollTo(0,0);render()}
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-proto]');if(p){cycle(+p.dataset.proto);return}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const [act,arg]=el.dataset.act.split(':');
  switch(act){
    case 'login':return go('home');
    case 'go':return go(arg);
    case 'mode':S.mode=arg;break;
    case 'gv':S.gv=arg;break;
    case 'who':S.who=arg;break;
    case 'ed':if(arg==='all')S.editions=['all'];else{const s=S.editions.filter(x=>x!=='all');S.editions=s.includes(arg)?s.filter(x=>x!==arg):[...s,arg];if(!S.editions.length)S.editions=['all']}break;
    case 'start':resetRound();return go(S.mode==='game'?'game':'practice');
    case 'play':S.playing=!S.playing;if(S.t>=30)S.t=0;break;
    case 'restart':S.t=0;S.playing=true;break;
    case 'slot':S.slot=+arg;break;
    case 'place':place();window.scrollTo(0,0);break;
    case 'check':check();window.scrollTo(0,0);break;
    case 'judge':S.judge=arg;if(arg==='yes'&&!S.res.named){S.res.named=true;S.tokens=Math.min(5,S.tokens+1)}break;
    case 'yr':S.year=Math.max(1950,Math.min(2025,S.year+ +arg));break;
    case 'next':S.song++;resetRound();return go(S.screen==='gameReveal'?'game':'practice');
  }
  render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='proto-screen')return;
  const k=e.target.dataset.in;if(!k)return;
  if(k==='year'){S.year=+e.target.value;document.querySelectorAll('[data-year]').forEach(o=>o.textContent=S.year);
    document.querySelectorAll('[data-needle]').forEach(n=>n.style.left=((S.year-1950)/75*100)+'%')}
  else S[k]=e.target.value;
});
document.addEventListener('change',e=>{if(e.target.id==='proto-screen'){S.res=null;go(e.target.value)}});
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
window.addEventListener('hashchange',()=>{const v=readVariant();if(v!==variant){variant=v;render()}});
setInterval(()=>{if(!S.playing)return;S.t=Math.min(30,S.t+.25);
  if(S.t>=30){S.playing=false;render();return}
  document.querySelectorAll('[data-prog]').forEach(e=>e.style.width=(S.t/30*100)+'%');
  document.querySelectorAll('[data-time]').forEach(e=>e.textContent=fmt(S.t))},250);
render();
</script>
