name: Import catalogue

# Loads editions, cards and songs into Supabase from the snapshots in data/sources/.
# Safe to repeat: it writes only what changed and never touches year_overrides.
# Spotify caps a development-mode app per day, so each run looks up at most max_lookups tracks and
# the next run carries on. The daily run keeps going until every edition is in, then finds nothing new.
on:
  schedule:
    # Every evening at 21:30 UTC (22:30 in the Netherlands).
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      editions:
        description: "SKUs, comma-separated, or all"
        default: all
        required: true
      dry_run:
        description: "Only report, write nothing"
        type: boolean
        default: false
      max_lookups:
        description: "At most this many Spotify lookups in this run"
        default: "250"
        required: true

concurrency:
  group: import-catalogue
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://vijpefspdqpgpffwoxaj.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      EDITIONS: ${{ inputs.editions || 'all' }}
      MAX_LOOKUPS: ${{ inputs.max_lookups || '250' }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:catalogue -- --editions "$EDITIONS" --max-lookups "$MAX_LOOKUPS" $DRY_RUN
